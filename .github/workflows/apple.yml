name: apple
# macOS minutes are only spent when Apple code changes (paths filter) or on a manual run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'apple/**'
      - '.github/workflows/apple.yml'
jobs:
  apple:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: swift test (EACore)
        working-directory: apple/Packages/EACore
        run: swift test
