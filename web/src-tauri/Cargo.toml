[package]
name = "everythingapp"
version = "1.0.21"
license = "AGPL-3.0-only"
description = "Aeneas desktop wrapper"
authors = ["gnomecannon"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "everythingapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iroh = "1.4.1"
tokio = { version = "1", features = ["io-util", "time", "rt", "sync", "net", "process"] }
base64 = "0.22"
tauri-plugin-deep-link = "2"
# The home network route (src/home.rs): HTTPS pinned to the hub's own certificate, and Bonjour to find a moved hub.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ring = "0.17"
mdns-sd = { version = "0.21", default-features = false }
russh = { version = "0.65", default-features = false, features = ["ring"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
