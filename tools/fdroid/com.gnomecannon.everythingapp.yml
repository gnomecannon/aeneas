Categories:
  - Productivity
  - Time
License: AGPL-3.0-only
AuthorName: gnomecannon
WebSite: https://github.com/gnomecannon/aeneas
SourceCode: https://github.com/gnomecannon/aeneas
IssueTracker: https://github.com/gnomecannon/aeneas/issues
Changelog: https://github.com/gnomecannon/aeneas/releases

AutoName: Aeneas

RepoType: git
Repo: https://github.com/gnomecannon/aeneas.git

Builds:
  - versionName: 1.0.0
    versionCode: 1000000
    commit: v1.0.0
    subdir: web/src-tauri/gen/android/app
    sudo:
      - apt-get update
      - apt-get install -y -t bookworm-backports nodejs npm || apt-get install -y nodejs npm
    output: build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    srclibs:
      - rustup@1.28.2
    prebuild:
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain stable
      - source $HOME/.cargo/env
      - rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - cd ../../../../..
      - npm ci --workspace web --include-workspace-root
    build:
      - source $HOME/.cargo/env
      - export NDK_HOME=$$NDK$$ ANDROID_HOME=$$SDK$$
      - cd ../../../..
      - npx tauri android build --apk
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1000000
